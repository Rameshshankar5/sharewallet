<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ShareWallet invite</title>
  <style>
    :root {
      --bg: #F3F6FB; --card: #FFFFFF; --text: #0F172A; --muted: #4B5568;
      --primary: #1E40AF; --on-primary: #FFFFFF; --border: #DCE3ED;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1422; --card: #192134; --text: #F1F4FA; --muted: #A7B0C2;
        --primary: #5B8DEF; --on-primary: #0B1220; --border: rgba(255,255,255,0.09);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 24px; text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    a.button {
      display: block; padding: 14px; border-radius: 14px; background: var(--primary);
      color: var(--on-primary); font-weight: 700; text-decoration: none;
    }
    small { display: block; margin-top: 18px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>You have been invited to ShareWallet</h1>
    <p>Open the invite in the app to connect and start splitting expenses.</p>
    <a class="button" id="open" href="#">Open in ShareWallet</a>
    <small>
      Don't have the app yet? Ask the person who sent you this link for it,
      install it, then tap the link again.
    </small>
  </main>
  <script>
    // Only reached when the link opened in a browser rather than the app —
    // typically an in-app browser, which does not hand links to other apps.
    // The button asks Android to open the app directly instead.
    var code = (location.pathname.match(/^\/i\/([A-Za-z0-9]{12})\/?$/) || [])[1];
    var open = document.getElementById('open');
    if (code) {
      open.href = /android/i.test(navigator.userAgent)
        ? 'intent://i/' + code + '#Intent;scheme=sharewallet;package=com.sharewallet.app;end'
        : 'sharewallet://i/' + code;
    } else {
      document.querySelector('h1').textContent = 'This link is incomplete';
      document.querySelector('p').textContent = 'Ask the person who sent it to share it again.';
      open.style.display = 'none';
    }
  </script>
</body>
</html>
